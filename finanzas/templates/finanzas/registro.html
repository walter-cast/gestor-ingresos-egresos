{% extends "finanzas/base.html" %}

{% block content %}

    <h2>Crear cuenta</h2>

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarme</button>
        <a class="boton gris" href="{% url 'login' %}">Ya tengo cuenta</a>
    </form>
</div>
{% endblock %}
